micronaut:
  application:
    name: micronaut-book-app
  server:
    context-path: /api
  security:
    enabled: true
    authentication: bearer
	intercept-url-map:
	  - pattern: /auth/login
	      access:
	        - isAnonymous()
	  - pattern: /books/**
	      access:
	        - isAuthenticated()
  datasources:
	default:
	  url: jdbc:h2:file:./db/testdb;DB_CLOSE_DELAY=-1
	  driver-class-name: org.h2.Driver
	  username: sa
	  password: ""
	  schema-generate: NONE
